version: "3.8"

services:
  clot_order_mongo:
    image: mongo:latest
    container_name: clot_order_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: clot_orders
    volumes:
      - mongo_data:/data/db

  app-1:
    build: .
    container_name: app-1
    restart: always
    depends_on:
      - clot_order_mongo
    environment:
      MONGO_URI: "mongodb://admin:password@clot_order_mongo:27017/clot_orders?authSource=admin"
      PORT: "5000"
    ports:
      - "5000:5000"

volumes:
  mongo_data:
